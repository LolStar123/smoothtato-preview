<!doctype html>
<html lang="en">
    <meta charset="utf-8" /><meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    /><title>smoothtato / cosmetics</title
    ><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="identity.css" />
    <body>
        <header>
            <a href="https://poetato.app">poetato / smoothtato</a>
            <nav>
                <a href="https://github.com/LolStar123/smoothtato-preview"
                    >code</a
                ><a
                    href="https://lolstar123.github.io/just-a-little-further/"
                    >atul's projects</a
                >
            </nav>
        </header>
        <main><nav class="tool-tabs" aria-label="Smoothtato tools"><a href="../">graphics</a><a href="./" aria-current="page">cosmetics</a></nav>
            <div class="title">
                <div>
                                        <h1>Path of Exile cosmetics</h1>
                </div>
            </div>
            <p id="profile-summary" class="profile-summary">Loading profile...</p>
            <div class="filters">
                <label
                    >search<input
                        id="search"
                        type="search"
                        placeholder="celestial, arc, righteous fire..." /></label
                ><label
                    >skill<select id="skill">
                        <option value="">all skills</option>
                    </select></label
                ><label
                    >mapping confidence<select id="confidence">
                        <option value="">all entries</option>
                        <option>HIGH</option>
                        <option>MEDIUM</option>
                        <option>LOW</option>
                    </select></label
                >
            </div>
            <div class="workspace">
                <section>
                    <div class="results-head">
                        <p id="count" tabindex="-1" aria-live="polite"></p>
                        <div>
                            <button id="prev">previous</button
                            ><button id="next">next</button>
                        </div>
                    </div>
                    <div id="catalogue"></div>
                    <div class="pagination-bottom"><button id="prev-bottom">previous</button><span id="page-note"></span><button id="next-bottom">next</button></div>
                </section>
                <aside id="effect-desk">
                    <a class="back-to-catalogue" href="#catalogue"
                        >back to effects</a
                    >
                    <h2 id="effect-title" tabindex="-1">select an effect</h2>
                    <div id="preview"></div>
                    <p id="evidence"></p>
                    <button id="add">add to loadout</button>
                    <h3>your loadout <span id="loadout-count">0</span></h3>
                    <div id="loadout"></div>
                    <p id="status" role="status"></p>
                    <button id="export">export profile</button>
                    <details>
                        <summary>import an existing code</summary>
                        <label
                            >paste a STATO1 code<textarea
                                id="import-code"
                                rows="4"
                            ></textarea></label
                        ><button id="import">import profile</button>
                    </details>
                    <details>
                        <summary>asset mappings</summary>
                        <p id="blurb"></p><pre id="pairs"></pre>
                    </details>
                </aside>
            </div>
            <footer><a href="https://github.com/LolStar123/smoothtato-preview#readme">Compatibility &amp; credits</a></footer>
        </main>
        <script type="module" src="app.mjs"></script>
    </body>
</html>
